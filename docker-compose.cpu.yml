version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      # Telegram alerts (optional): set them in .env next to this file; empty = disabled
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_MIN_INTERVAL_S=${TELEGRAM_MIN_INTERVAL_S:-30}
    volumes:
      - ./data/demo_cameras:/app/demo_cameras
      - sialar_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  sialar_data:
